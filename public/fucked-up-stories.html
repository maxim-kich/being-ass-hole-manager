<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Story curation — BAHM</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css">
<script type="module" src="/admin.js"></script>
</head>
<body class="admin-page">
<header class="site-header"><a href="/">BAHM / Curation</a><button id="logout" class="text-button" hidden>Sign out</button></header>
<main class="admin-main">
<section id="login-view" class="admin-login">
<h1>Story curation</h1><p>Sign in to handpick stories for the homepage.</p>
<form id="login-form"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" id="login-submit">Sign in</button></form>
</section>
<section id="admin-view" hidden>
<h1>The best of the worst</h1><p>Read submissions and choose which stories appear on the homepage.</p>
<label class="gallery-setting"><span>Show this section on the homepage</span><input id="gallery-visible" type="checkbox" role="switch" disabled></label>
<div class="admin-toolbar"><label for="filter">Show</label><select id="filter"><option value="all">All submissions</option><option value="featured">On the homepage</option><option value="unfeatured">Not on the homepage</option></select><label for="verdict-filter">Verdict</label><select id="verdict-filter"><option value="all">All verdicts</option><option value="yes">Yes</option><option value="no">No</option></select><label for="outcome-filter">Outcome</label><select id="outcome-filter"><option value="all">All outcomes</option><option value="successful">Successful</option><option value="unsuccessful">Unsuccessful</option></select><button class="secondary" id="refresh">Refresh</button></div>
<p id="admin-empty" hidden>No stories here yet.</p><div id="admin-stories" class="story-grid"></div><button id="admin-more" class="secondary" hidden>More stories</button>
</section>
<p id="admin-message" role="status" aria-live="polite"></p>
</main>
</body></html>
